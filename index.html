<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0D; --card: #161616; --card2: #1E1E1E; --line: #282828;
    --text: #EEEAE5; --muted: #8E8881; --dim: #5E5953;
    --good: #5CB87A; --warn: #D4A843; --bad: #E85D75; --accent: #5CB87A;
    --mono: 'Space Mono', ui-monospace, Menlo, monospace;
    --w: 540px;
    --composer-h: 118px; --tab-h: 62px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', -apple-system, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  .mono { font-family: var(--mono); }
  .app { max-width: var(--w); margin: 0 auto; padding-top: env(safe-area-inset-top); }

  /* Header */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(13,13,13,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 14px 18px 10px; padding-top: calc(14px + env(safe-area-inset-top)); margin-top: calc(-1 * env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid transparent; }
  .top.scrolled { border-bottom-color: var(--line); }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .month-nav button.arrow { width: 34px; height: 34px; border-radius: 10px; color: var(--muted); font-size: 20px; line-height: 1; }
  .month-nav button.arrow:hover { background: var(--card2); color: var(--text); }
  .month-title { font-size: 20px; font-weight: 700; letter-spacing: -.3px; padding: 4px 6px; border-radius: 8px; }
  .month-title small { font-weight: 500; color: var(--muted); font-size: 15px; margin-left: 4px; }
  .today-pill { font-size: 12px; font-weight: 600; color: var(--accent); border: 1px solid #2E4A38; padding: 5px 10px; border-radius: 99px; }
  .page-title { font-size: 20px; font-weight: 700; }

  main { padding: 6px 16px calc(var(--composer-h) + var(--tab-h) + 28px + env(safe-area-inset-bottom)); }
  main.no-composer { padding-bottom: calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; }
  .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .big { font-family: var(--mono); font-size: 34px; font-weight: 700; letter-spacing: -1px; margin-top: 4px; }
  .of { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .bar { height: 8px; background: #252525; border-radius: 99px; overflow: hidden; margin: 16px 0 12px; position: relative; }
  .bar > i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
  .bar .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .55; border-radius: 2px; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat .v { font-family: var(--mono); font-size: 15px; font-weight: 700; margin-top: 3px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  .note b { color: var(--text); font-weight: 600; }

  /* Transaction list */
  .day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 4px 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .day-head .mono { font-size: 12px; }
  .tx-group { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .tx { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
  .tx:last-child { border-bottom: none; }
  .tx:hover { background: var(--card2); }
  .tx-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
  .tx-main { flex: 1; min-width: 0; }
  .tx-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-cat { font-size: 12px; margin-top: 2px; color: var(--muted); }
  .tx-amt { font-family: var(--mono); font-size: 14px; font-weight: 700; white-space: nowrap; }
  .tag { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: #262626; color: var(--muted); margin-left: 6px; vertical-align: 1px; letter-spacing: .3px; }
  .empty { text-align: center; padding: 44px 20px; color: var(--muted); }
  .empty .e-ic { font-size: 38px; margin-bottom: 10px; }
  .empty h3 { color: var(--text); font-size: 17px; margin-bottom: 6px; }
  .examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  .examples button { font-size: 13px; padding: 8px 12px; border-radius: 99px; background: var(--card2); border: 1px solid var(--line); color: var(--text); }

  /* Composer */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; pointer-events: none; }
  .dock-inner { max-width: var(--w); margin: 0 auto; pointer-events: auto; background: linear-gradient(to bottom, rgba(13,13,13,0), var(--bg) 18px); padding-top: 18px; }
  .composer { margin: 0 12px 10px; background: var(--card2); border: 1px solid #333; border-radius: 20px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .composer.hidden { display: none; }
  .chips { display: flex; gap: 6px; padding: 2px 4px 8px; flex-wrap: wrap; min-height: 34px; align-items: center; }
  .chips .hint { font-size: 12.5px; color: var(--dim); padding-left: 4px; }
  .chip { position: relative; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: #2A2A2A; border: 1px solid #333; white-space: nowrap; }
  .chip.missing { color: var(--warn); border-color: #4A4026; }
  .chip input[type=date] { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
  .chip input[type=date]::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .compose-row { display: flex; gap: 8px; align-items: center; }
  .compose-row input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; font-size: 16px; padding: 10px 8px; }
  .compose-row input::placeholder { color: var(--dim); }
  .add-btn { width: 44px; height: 44px; border-radius: 14px; background: #2C2C2C; color: var(--dim); font-size: 24px; font-weight: 500; display: grid; place-items: center; transition: background .15s, color .15s; flex-shrink: 0; }
  .add-btn.ready { background: var(--accent); color: #0D0D0D; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

  /* Tabs */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: rgba(13,13,13,.97); padding-bottom: env(safe-area-inset-bottom); }
  .tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 10px; font-size: 11px; font-weight: 600; color: var(--dim); }
  .tabs button svg { width: 22px; height: 22px; }
  .tabs button.on { color: var(--text); }
  .tabs button.on svg { color: var(--accent); }

  /* Calendar */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal .dow { text-align: center; font-size: 11px; color: var(--dim); font-weight: 600; padding-bottom: 4px; }
  .cal .d { aspect-ratio: 1 / 1.08; border-radius: 11px; background: #1A1A1A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; border: 1px solid transparent; }
  .cal .d .n { font-size: 13px; font-weight: 600; }
  .cal .d .t { font-family: var(--mono); font-size: 9.5px; color: var(--text); opacity: .9; }
  .cal .d.future { opacity: .35; }
  .cal .d.today .n { color: var(--accent); }
  .cal .d.sel { border-color: var(--text); }
  .cal .blank { background: transparent; }
  .cal-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 12px; }

  /* Insights */
  .donut-wrap { display: flex; gap: 18px; align-items: center; }
  .donut-wrap svg { width: 150px; height: 150px; flex-shrink: 0; }
  .legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend .sw { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .legend .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .legend .pc { font-family: var(--mono); font-size: 12px; }
  .daily svg { width: 100%; height: 130px; display: block; margin-top: 10px; }
  .delta { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; margin-top: 8px; }
  .delta.up { background: rgba(232,93,117,.13); color: var(--bad); }
  .delta.down { background: rgba(92,184,122,.13); color: var(--good); }
  .cat-card { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 14px; margin-bottom: 10px; }
  .cat-card summary { list-style: none; padding: 14px 16px; cursor: pointer; }
  .cat-card summary::-webkit-details-marker { display: none; }
  .cat-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cat-top .nm { font-weight: 600; font-size: 14.5px; }
  .cat-top .amt { font-family: var(--mono); font-size: 13px; text-align: right; }
  .cat-top .amt span { color: var(--muted); }
  .cat-card .bar { margin: 10px 0 0; height: 6px; }
  .cat-card .over { font-size: 12px; color: var(--bad); font-weight: 600; margin-top: 8px; }
  .cat-card .rows { border-top: 1px solid var(--line); padding: 6px 16px 10px; }
  .cat-card .rows button { display: flex; justify-content: space-between; width: 100%; padding: 6px 0; font-size: 13px; color: var(--muted); text-align: left; gap: 10px; }
  .cat-card .rows button span:last-child { font-family: var(--mono); color: var(--text); }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.1px; margin: 22px 4px 10px; }
  .top-list div { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; border-bottom: 1px solid var(--line); gap: 10px; }
  .top-list div:last-child { border-bottom: none; }
  .top-list span:last-child { font-family: var(--mono); }

  /* Settings */
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .set-row:last-child { border-bottom: none; }
  .set-row .nm { font-size: 14.5px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .set-row .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .money-in { display: flex; align-items: center; background: #101010; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; width: 120px; }
  .money-in span { color: var(--dim); font-family: var(--mono); font-size: 13px; }
  .money-in input { width: 100%; background: transparent; border: none; outline: none; padding: 9px 6px; font-family: var(--mono); font-size: 14px; text-align: right; }
  .btn { padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; background: var(--card2); border: 1px solid #333; }
  .btn.primary { background: var(--accent); color: #0D0D0D; border-color: var(--accent); }
  .btn.danger { color: var(--bad); border-color: #4A2530; }
  .btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select { width: 100%; background: #101010; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 16px; outline: none; color-scheme: dark; }
  .field input:focus, .field select:focus, .money-in:focus-within { border-color: #4A4A4A; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); margin: 4px 0 14px; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .x-btn { color: var(--dim); font-size: 16px; width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; }
  .x-btn:hover { background: var(--card2); color: var(--bad); }
  .fine { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 10px; }

  .bal-card { width: 100%; text-align: left; display: block; color: inherit; font: inherit; }
  .set-row.btnrow { width: 100%; text-align: left; }
  .bal-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .bal-row .money-in { flex: 1; width: auto; }
  .plain-in { background: #101010; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; outline: none; color-scheme: dark; }
  .delta.flat { background: #222; color: var(--muted); }
  .bal-chart svg { width: 100%; height: 150px; display: block; margin-top: 12px; }

  /* Sheet */
  .sheet-wrap { position: fixed; inset: 0; z-index: 50; display: none; }
  .sheet-wrap.open { display: block; }
  .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.6); animation: fade .2s; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: var(--w); margin: 0 auto; background: #141414; border: 1px solid var(--line); border-bottom: none; border-radius: 22px 22px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; animation: up .25s cubic-bezier(.2,.9,.3,1); }
  .grabber { width: 38px; height: 5px; border-radius: 9px; background: #333; margin: 0 auto 14px; }
  .sheet h2 { font-size: 18px; margin-bottom: 16px; }
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .cat-opt { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #101010; border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; text-align: left; }
  .cat-opt.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, #101010); }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-actions .btn { flex: 1; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }

  /* Toast */
  .toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: calc(var(--composer-h) + var(--tab-h) + 30px + env(safe-area-inset-bottom)); z-index: 60; background: #EEEAE5; color: #111; border-radius: 14px; padding: 11px 14px; font-size: 13.5px; font-weight: 500; display: flex; gap: 14px; align-items: center; max-width: min(92vw, 500px); box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: up .2s; }
  .toast.low { bottom: calc(var(--tab-h) + 22px + env(safe-area-inset-bottom)); }
  .toast button { font-weight: 700; color: #1F7A44; }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>

<div class="dock">
  <div class="dock-inner">
    <div class="composer" id="composer">
      <div class="chips" id="chips"></div>
      <div class="compose-row">
        <input id="q" type="text" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Lunch $12 yesterday" aria-label="Add an expense">
        <button class="add-btn" id="addBtn" aria-label="Add expense">+</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Calendar</button>
      <button data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Insights</button>
      <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
    </nav>
  </div>
</div>

<div class="sheet-wrap" id="sheetWrap"><div class="backdrop" data-action="close-sheet"></div><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileIn" accept=".csv,.json,text/csv,application/json" hidden>

<script>
"use strict";

/* ───────────── Config ───────────── */
var STORE_KEY = "expense_tracker_v4";
var OLD_KEY = "expense_tracker_v3";
var APP_VERSION = "4.1.1";
var NOT_BUDGETED = "Expensed to Work";

var CATS = {
  "Groceries": { budget: 500, color: "#5CB87A", icon: "🛒", keywords: ["grocery","groceries","metro","loblaws","no frills","nofrills","freshco","sobeys","whole foods","costco","food basics","farm boy","t&t","produce","meat","dairy","superstore","real canadian","longos","fortinos","zehrs","valumart","independent grocer","bulk barn","iga","walmart groceries","galleria","adonis","btrust","h mart"] },
  "Eating Out": { budget: 200, color: "#E86C47", icon: "🍽️", keywords: ["restaurant","uber eats","ubereats","doordash","skip the dishes","skipthedishes","coffee","cafe","latte","starbucks","tim hortons","timmies","tims","mcdonalds","mcdonald's","wendys","wendy's","pizza","sushi","lunch","dinner","breakfast","brunch","bar","pub","beer","wine","drinks","chipotle","subway","popeyes","kfc","a&w","harveys","swiss chalet","taco","tacos","pho","ramen","takeout","take out","burrito","shawarma","burger","bubble tea","boba","snack","dessert","ice cream","bakery"] },
  "Transportation": { budget: 450, color: "#4A90D9", icon: "🚗", keywords: ["gas","fuel","uber","lyft","ttc","presto","go train","go transit","parking","car wash","oil change","mechanic","tire","tires","auto","esso","shell","petro","petro-canada","pioneer","canadian tire","highway","407","toll","transit","bus","car insurance","car payment","taxi","bike share","green p"] },
  "Bills & Subscriptions": { budget: 150, color: "#4ECDC4", icon: "📱", keywords: ["phone","phone bill","cell","mobile","subscription","membership","adobe","microsoft","icloud","dropbox","chatgpt","openai","claude","saas","software","domain","hosting","spotify","netflix","disney","disney+","crave","apple music","youtube premium","prime video","rogers","bell","fido","virgin","telus","koodo","freedom","public mobile","zen planner","gohighlevel","canva","notion","google one"] },
  "Housing": { budget: 1000, color: "#7B68AE", icon: "🏠", keywords: ["rent","mortgage","hydro","electricity","water","water bill","internet","enbridge","gas bill","property tax","condo fee","maintenance fee","home insurance","tenant insurance","renters insurance","furniture"] },
  "Entertainment": { budget: 150, color: "#E85D75", icon: "🎬", keywords: ["movie","movies","cinema","cineplex","concert","ticket","tickets","game","games","playstation","xbox","nintendo","steam","event","show","bowling","arcade","escape room","golf","museum","festival","raptors","leafs","jays"] },
  "Shopping": { budget: 100, color: "#D4A843", icon: "🛍️", keywords: ["amazon","walmart","ikea","clothes","shoes","shirt","pants","jacket","hoodie","winners","marshalls","homesense","dollarama","electronics","best buy","staples","home depot","lowes","uniqlo","h&m","zara","nike","adidas","lululemon","gift","apple store","sport chek"] },
  "Health & Personal Care": { budget: 100, color: "#A78BFA", icon: "💊", keywords: ["pharmacy","doctor","dentist","physio","chiro","massage","prescription","advil","tylenol","shoppers","shoppers drug mart","rexall","supplement","supplements","protein","creatine","vitamin","vitamins","haircut","barber","grooming","skincare","deodorant","toothpaste","shampoo","optometrist","glasses","contacts","gym"] },
  "Expensed to Work": { budget: null, color: "#F59E0B", icon: "💼", keywords: ["expensed","expense to work","work expense","reimbursed","reimbursable","business expense","client","mileage","for work"] },
  "Other": { budget: 100, color: "#8E8E93", icon: "📦", keywords: [] }

/* ───────────── Render: calendar ───────────── */

/* ───────────── Render: insights ───────────── */
function donut(cats, total) {
  var r = 58, C = 2 * Math.PI * r, acc = 0, segs = "";
  cats.forEach(function(c) {
    var len = c.v / total * C;
    segs += '<circle r="' + r + '" cx="75" cy="75" fill="none" stroke="' + CATS[c.k].color + '" stroke-width="20" stroke-dasharray="' +
      Math.max(len - 1.5, 0.01).toFixed(2) + ' ' + (C - Math.max(len - 1.5, 0.01)).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 75 75)"/>';
    acc += len;
  });
  return '<svg viewBox="0 0 150 150"><circle r="' + r + '" cx="75" cy="75" fill="none" stroke="#222" stroke-width="20"/>' + segs +
    '<text x="75" y="71" text-anchor="middle" fill="#8E8881" font-size="10" font-family="DM Sans, -apple-system, sans-serif">TOTAL</text>' +
    '<text x="75" y="89" text-anchor="middle" fill="#EEEAE5" font-size="15" font-weight="700" font-family="Space Mono, Menlo, monospace">' + fmtShort(total) + '</text></svg>';
}
function dailyBars(list, y, m) {
  var n = daysIn(y, m), vals = [], max = 0, t = todayIso();
  for (var d = 1; d <= n; d++) vals.push(0);
  list.forEach(function(x) { vals[+x.date.slice(8) - 1] += x.amount; });
  vals.forEach(function(v) { if (v > max) max = v; });
  var W = n * 10, H = 100, bars = "";
  var elapsed = isCurrentMonth() ? new Date().getDate() : (iso(y, m, 1) > t ? 0 : n);
  var avg = elapsed ? vals.slice(0, elapsed).reduce(function(a, b) { return a + b; }, 0) / elapsed : 0;
  vals.forEach(function(v, i) {
    var h = max ? Math.max(v / max * (H - 16), v ? 2 : 0) : 0;
    var isToday = iso(y, m, i + 1) === t;
    bars += '<rect x="' + (i * 10 + 1.5) + '" y="' + (H - 12 - h) + '" width="7" height="' + h + '" rx="2" fill="' + (isToday ? '#EEEAE5' : '#5CB87A') + '" opacity="' + (v ? 0.9 : 0) + '"><title>' + MON[m] + ' ' + (i + 1) + ': ' + fmt(v) + '</title></rect>';
  });

  var avgLine = avg && max ? '<line x1="0" x2="' + W + '" y1="' + (H - 12 - avg / max * (H - 16)) + '" y2="' + (H - 12 - avg / max * (H - 16)) + '" stroke="#D4A843" stroke-dasharray="3 3" stroke-width="1"/>' : '';

}
function renderInsights() {
  var y = V.y, m = V.m, list = monthTx(y, m), total = sum(list);

  var html = "";
  if (!list.length) {
    $view.innerHTML = balanceTrend() + '<div class="empty"><div class="e-ic">📊</div><h3>No spending logged in ' + MONTHS[m] + '</h3><div>Charts appear once you log a few expenses.</div></div>';
    return;
  }
  // Compare to last month (to the same day if this is the current month)

  var cats = CAT_KEYS.map(function(k) { return { k: k, v: sum(list.filter(function(t) { return t.category === k; })) }; })
    .filter(function(c) { return c.v > 0; }).sort(function(a, b) { return b.v - a.v; });

  html += '<div class="card"><div class="label">Total spending</div><div class="big">' + fmt(total) + '</div>' +
    (delta ? '<span class="delta ' + (diff > 0 ? 'up' : 'down') + '">' + (diff > 0 ? '▲ ' : '▼ ') + esc(delta) + '</span>' : '') +
    '<div class="donut-wrap" style="margin-top:16px">' + donut(cats, total) + '<div class="legend">' +
    cats.slice(0, 7).map(function(c) {

  html += '<div class="section-title">Budgets by category</div>';
  CAT_KEYS.forEach(function(k) {

    var b = S.budgets[k], has = b !== null && b !== undefined && k !== NOT_BUDGETED && b > 0;

    html += '<details class="cat-card" style="--c:' + c.color + '"><summary><div class="cat-top"><span class="nm">' + c.icon + ' ' + esc(k) + '</span>' +
      '<span class="amt">' + fmt(spent) + (has ? ' <span>/ ' + fmt0(b) + '</span>' : (k === NOT_BUDGETED ? ' <span>not budgeted</span>' : '')) + '</span></div>' +
      (has ? '<div class="bar"><i style="width:' + Math.min(pct, 100) + '%;background:' + col + '"></i></div>' : '') +

}

/* ───────────── Composer ───────────── */

}

  if (!val) {

    $add.className = "add-btn";
    return;
  }
  var p = draft(), c = CATS[p.category];
  var ok = p.amount > 0;
  $chips.innerHTML =
    '<span class="chip' + (ok ? '' : ' missing') + '"><span class="mono">' + (ok ? fmt(p.amount) : 'add amount') + '</span></span>' +
    '<label class="chip">📅 ' + dateLabel(p.date) + '<input type="date" id="dateChip" value="' + p.date + '" aria-label="Change date"></label>' +
    '<button class="chip" data-action="pick-cat" style="color:' + c.color + '">' + c.icon + ' ' + esc(p.category) + ' ▾</button>';
  $add.className = "add-btn" + (ok ? " ready" : "");
}
function addFromComposer() {
  if (!$q.value.trim()) { $q.focus(); return; }
  var p = draft();
  if (!(p.amount > 0)) {
    $composer.classList.remove("shake"); void $composer.offsetWidth; $composer.classList.add("shake");
    toast("Add an amount — e.g. “" + ($q.value.trim() || "Lunch") + " 12”");
    return;
  }
  var tx = { id: uid(), name: p.name || p.category, amount: round2(p.amount), category: p.category, date: p.date, created: new Date().toISOString() };
  if (override.category && p.name) learn(p.name, override.category);
  S.transactions.push(tx);

  $q.value = ""; override = {};

  if (d.getFullYear() !== V.y || d.getMonth() !== V.m) { V.y = d.getFullYear(); V.m = d.getMonth(); }
  if (V.tab === "calendar") V.sel = tx.date;
  render();
  toast("Added " + tx.name + " · " + fmt(tx.amount) + " · " + dateLabel(tx.date), "Undo", function() {

  });
}

}
function openNewBill() {
  var day = new Date().getDate();
  openSheet('<h2>New recurring bill</h2>' +
    '<label class="field"><span>Name</span><input id="bName" placeholder="Rent, Phone, Spotify…" autocomplete="off"></label>' +
    '<div class="two"><label class="field"><span>Amount</span><input id="bAmt" inputmode="decimal" placeholder="0.00"></label>' +
    '<label class="field"><span>Day of month</span><input id="bDay" type="number" min="1" max="31" value="1"></label></div>' +
    '<label class="field"><span>Category</span><select id="bCat">' + catOptions("", true) + '</select></label>' +
    '<label class="check"><input type="checkbox" id="bNow"> Also log this month\'s (if its day has passed)</label>' +
    '<div class="sheet-actions"><button class="btn" data-action="close-sheet">Cancel</button><button class="btn primary" data-action="save-bill">Add bill</button></div>',
    { type: "bill" });
  document.getElementById("bName").focus();
}

/* ───────────── Toast ───────────── */
var toastTimer = null;
function toast(msg, actionLabel, fn) {
  var old = document.querySelector(".toast");
  if (old) old.remove();
  clearTimeout(toastTimer);
  var el = document.createElement("div");
  el.className = "toast" + ($composer.classList.contains("hidden") ? " low" : "");
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (actionLabel ? '<button>' + esc(actionLabel) + '</button>' : '');
  if (actionLabel) el.querySelector("button").onclick = function() { el.remove(); fn(); };
  document.body.appendChild(el);
  toastTimer = setTimeout(function() { el.remove(); }, actionLabel ? 5000 : 3000);
}

/* ───────────── CSV / backup ───────────── */
function csvCell(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function download(name, text, type) {
  var blob = new Blob([text], { type: type });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 2000);
}
function exportCsv() {
  var rows = [["Date", "Description", "Amount", "Category", "Recurring"]];
  sortTx(S.transactions).reverse().forEach(function(t) { rows.push([t.date, t.name, t.amount.toFixed(2), t.category, t.recurringId ? "yes" : ""]); });
  download("expenses-" + todayIso() + ".csv", rows.map(function(r) { return r.map(csvCell).join(","); }).join("\n"), "text/csv");
  toast("Exported " + S.transactions.length + " expenses");
}
function parseCsv(text) {
  var rows = [], row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = ""; if (row.some(function(c) { return c.trim(); })) rows.push(row); row = [];
    } else cell += ch;
  }
  row.push(cell); if (row.some(function(c) { return c.trim(); })) rows.push(row);
  return rows;
}
function toIsoDate(v) {
  v = String(v || "").trim();
  var m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(v);
  if (m) return iso(+m[1], +m[2] - 1, +m[3]);
  m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/.exec(v);
  if (m) { var y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return iso(y, +m[1] - 1, +m[2]); } // assumes MM/DD/YYYY
  var d = new Date(v);
  return isNaN(d) ? null : isoOf(d);
}
function importCsv(text) {
  var rows = parseCsv(text);
  if (rows.length < 2) { toast("That file has no rows to import"); return; }
  var head = rows[0].map(function(h) { return h.trim().toLowerCase(); });
  function col(names) { for (var i = 0; i < head.length; i++) for (var j = 0; j < names.length; j++) if (head[i].indexOf(names[j]) >= 0) return i; return -1; }
  var di = col(["date"]), ni = col(["description", "name", "merchant", "payee", "details", "memo"]), ai = col(["amount", "debit", "price", "cost", "withdrawal"]), ci = col(["category"]);
  if (di < 0 || ai < 0) { toast("Couldn't find Date and Amount columns"); return; }
  var seen = {};
  S.transactions.forEach(function(t) { seen[t.date + "|" + norm(t.name) + "|" + t.amount.toFixed(2)] = 1; });
  var added = 0, skipped = 0, bad = 0;
  rows.slice(1).forEach(function(r) {
    var date = toIsoDate(r[di]), amt = Math.abs(parseMoney(r[ai])), name = (ni >= 0 ? r[ni] : "").trim() || "Imported";
    if (!date || !(amt > 0)) { bad++; return; }
    amt = round2(amt);
    var key = date + "|" + norm(name) + "|" + amt.toFixed(2);
    if (seen[key]) { skipped++; return; }
    seen[key] = 1;
    var cat = ci >= 0 && CATS[(r[ci] || "").trim()] ? r[ci].trim() : classify(name);
    S.transactions.push({ id: uid(), name: name, amount: amt, category: cat, date: date, created: new Date().toISOString() });
    added++;
  });
  save(); render();
  toast("Imported " + added + (skipped ? " · " + skipped + " duplicates skipped" : "") + (bad ? " · " + bad + " unreadable rows" : ""));
}
function backup() {
  download("expense-tracker-backup-" + todayIso() + ".json", JSON.stringify(S, null, 1), "application/json");
  toast("Backup downloaded");
}
function restore(text) {
  var p;
  try { p = JSON.parse(text); } catch (e) { toast("That isn't a valid backup file"); return; }
  if (!p || !Array.isArray(p.transactions)) { toast("That isn't a valid backup file"); return; }
  if (!confirm("Replace everything in this browser with the " + p.transactions.length + " expenses in this backup?")) return;
  var b = defaults();
  cleanBudgets(p.budgets, b.budgets);
  b.transactions = cleanTx(p.transactions);
  b.recurring = cleanRecurring(p.recurring);
  b.skips = cleanSkips(p.skips);
  b.rules = cleanRules(p.rules);
  b.balances = cleanBalances(p.balances);
  b.budgets[NOT_BUDGETED] = null;
  S = b; save(); ensureRecurring(); render();
  toast("Restored " + S.transactions.length + " expenses");
}
var fileMode = "csv";
$file.addEventListener("change", function() {
  var f = $file.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function() {
    var text = String(r.result);
    if (fileMode === "json" || /\.json$/i.test(f.name)) restore(text); else importCsv(text);
    $file.value = "";
  };
  r.readAsText(f);
});

/* ───────────── Events ───────────── */
$q.addEventListener("input", function() { if (!$q.value.trim()) override = {}; updatePreview(); });
$q.addEventListener("keydown", function(e) { if (e.key === "Enter") { e.preventDefault(); addFromComposer(); } });
$add.addEventListener("click", addFromComposer);
$chips.addEventListener("change", function(e) {
  if (e.target.id === "dateChip" && e.target.value) { override.date = e.target.value; updatePreview(); }
});

document.getElementById("tabs").addEventListener("click", function(e) {
  var b = e.target.closest("button[data-tab]");
  if (!b) return;
  V.tab = b.getAttribute("data-tab");
  window.scrollTo(0, 0);
  render();
});

document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var a = el.getAttribute("data-action");
  switch (a) {
    case "prev": V.m--; if (V.m < 0) { V.m = 11; V.y--; } render(); break;
    case "next": V.m++; if (V.m > 11) { V.m = 0; V.y++; } render(); break;
    case "this-month": var n = new Date(); V.y = n.getFullYear(); V.m = n.getMonth(); V.sel = todayIso(); render(); break;
    case "example": $q.value = el.getAttribute("data-text"); updatePreview(); $q.focus(); break;
    case "pick-day": V.sel = el.getAttribute("data-day"); override.date = null; renderCalendar(); updatePreview(); break;
    case "pick-cat": openCatPicker(); break;
    case "edit": openEdit(el.getAttribute("data-id")); break;
    case "close-sheet": closeSheet(); break;
    case "sheet-cat":
      var cat = el.getAttribute("data-cat");
      if (sheetCtx && sheetCtx.type === "compose-cat") { override.category = cat; closeSheet(); updatePreview(); $q.focus(); }
      else if (sheetCtx && sheetCtx.type === "edit") {
        sheetCtx.cat = cat;
        $sheet.querySelectorAll(".cat-opt").forEach(function(b) { b.classList.toggle("on", b.getAttribute("data-cat") === cat); });
      }
      break;
    case "save-tx": saveEdit(); break;
    case "delete-tx": deleteTx(sheetCtx.id); closeSheet(); break;
    case "new-bill": openNewBill(); break;
    case "save-bill": saveBill(); break;
    case "del-bill":
      var bid = el.getAttribute("data-id"), bill = S.recurring.filter(function(b) { return b.id === bid; })[0];
      if (bill && confirm("Stop logging “" + bill.name + "” every month? Past entries stay.")) {
        S.recurring = S.recurring.filter(function(b) { return b.id !== bid; }); save(); render();
      }
      break;
    case "save-bal-inline":
      if (setBalance(ymKey(V.y, V.m), document.getElementById("balIn").value)) render();
      break;
    case "edit-bal": openBalanceEdit(el.getAttribute("data-ym")); break;
    case "save-bal-edit":
      if (setBalance(sheetCtx.ym, document.getElementById("balEdit").value)) { closeSheet(); render(); }
      break;
    case "del-bal":
      var bk = sheetCtx.ym, oldBal = S.balances[bk];
      delete S.balances[bk]; save(); closeSheet(); render();
      toast("Removed " + ymLabel(bk, true) + " balance", "Undo", function() { S.balances[bk] = oldBal; save(); render(); });
      break;
    case "add-bal":
      var mk = document.getElementById("balMonth").value;
      if (!/^\d{4}-\d{2}$/.test(mk)) { toast("Pick a month"); break; }
      if (mk > ymOf(todayIso())) { toast("That month hasn't started yet"); break; }
      if (setBalance(mk, document.getElementById("balAddIn").value)) render();
      break;
    case "export-csv": exportCsv(); break;
    case "import": fileMode = "csv"; $file.accept = ".csv,text/csv"; $file.click(); break;
    case "backup": backup(); break;
    case "restore": fileMode = "json"; $file.accept = ".json,application/json"; $file.click(); break;
    case "clear-rules": S.rules = {}; save(); render(); toast("Learned categories reset"); break;
    case "erase":
      if (confirm("Erase every expense, budget and bill in this browser? Download a backup first if you might want them.")) {
        S = defaults(); S.budgets[NOT_BUDGETED] = null; save();
        try { localStorage.removeItem(OLD_KEY); } catch (err) {}
        render(); toast("All data erased");
      }
      break;
  }
});

function saveEdit() {
  var t = findTx(sheetCtx.id);
  if (!t) return closeSheet();
  var name = document.getElementById("eName").value.trim();
  var amt = parseMoney(document.getElementById("eAmt").value);
  var date = document.getElementById("eDate").value;
  if (!(amt > 0)) { toast("Enter an amount above $0"); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast("Pick a date"); return; }
  if (sheetCtx.cat !== t.category || norm(name) !== norm(t.name)) learn(name || t.name, sheetCtx.cat);
  t.name = name || t.name; t.amount = round2(amt); t.date = date; t.category = sheetCtx.cat;
  save(); closeSheet(); render();
  toast("Saved");
}
function deleteTx(id) {
  var t = findTx(id);
  if (!t) return;
  var idx = S.transactions.indexOf(t);
  S.transactions.splice(idx, 1);
  var skipKey = t.recurringId ? t.recurringId + ":" + ymOf(t.date) : null;
  if (skipKey && S.skips.indexOf(skipKey) < 0) S.skips.push(skipKey);
  save(); render();
  toast("Deleted " + t.name, "Undo", function() {
    S.transactions.push(t);
    if (skipKey) S.skips = S.skips.filter(function(k) { return k !== skipKey; });
    save(); render();
  });
}
function saveBill() {
  var name = document.getElementById("bName").value.trim();
  var amt = parseMoney(document.getElementById("bAmt").value);
  var day = Math.min(31, Math.max(1, parseInt(document.getElementById("bDay").value, 10) || 1));
  var cat = document.getElementById("bCat").value || classify(name);
  var logNow = document.getElementById("bNow").checked;
  if (!name) { toast("Give the bill a name"); return; }
  if (!(amt > 0)) { toast("Enter an amount above $0"); return; }
  var n = new Date(), start = ymKey(n.getFullYear(), n.getMonth());
  var thisMonthDate = iso(n.getFullYear(), n.getMonth(), Math.min(day, daysIn(n.getFullYear(), n.getMonth())));
  var b = { id: "r" + uid(), name: name, amount: round2(amt), category: cat, day: day, start: start };
  if (!logNow && thisMonthDate <= todayIso()) S.skips.push(b.id + ":" + start);
  S.recurring.push(b);
  ensureRecurring(); save(); closeSheet(); render();
  toast(name + " will be logged on the " + ordinal(day) + " of each month");
}

// Budgets: save as you type
document.addEventListener("input", function(e) {
  var k = e.target.getAttribute && e.target.getAttribute("data-budget");
  if (!k) return;
  var v = parseMoney(e.target.value);
  S.budgets[k] = v > 0 ? round2(v) : 0;
  save();
  var tot = document.getElementById("budgetTotal");
  if (tot) tot.textContent = fmt0(totalBudget());
});

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape" && $sheetWrap.classList.contains("open")) closeSheet();
  if ((e.key === "/" || e.key === "n") && document.activeElement === document.body && !$composer.classList.contains("hidden")) { e.preventDefault(); $q.focus(); }
  if (e.key === "Enter" && sheetCtx && sheetCtx.type === "edit" && e.target.tagName === "INPUT") { e.preventDefault(); saveEdit(); }
  if (e.key === "Enter" && e.target.id === "balIn") { e.preventDefault(); if (setBalance(ymKey(V.y, V.m), e.target.value)) render(); }
  if (e.key === "Enter" && e.target.id === "balEdit") { e.preventDefault(); if (setBalance(sheetCtx.ym, e.target.value)) { closeSheet(); render(); } }
  if (e.key === "Enter" && e.target.id === "balAddIn") { e.preventDefault(); document.querySelector('[data-action="add-bal"]').click(); }
  if (e.key === "Enter" && sheetCtx && sheetCtx.type === "bill" && e.target.tagName === "INPUT") { e.preventDefault(); saveBill(); }
});
window.addEventListener("scroll", function() { $top.classList.toggle("scrolled", window.scrollY > 4); }, { passive: true });
document.addEventListener("visibilitychange", function() { if (!document.hidden && ensureRecurring()) render(); });

/* ───────────── Init ───────────── */
ensureRecurring();
render();
if (migratedCount) toast("Moved " + migratedCount + " expenses over from the previous version");
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function() {});
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function() { navigator.serviceWorker.register("sw.js").catch(function() {}); });
}
</script>
